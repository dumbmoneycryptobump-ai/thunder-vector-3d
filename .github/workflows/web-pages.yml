name: Build and publish cross-device game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $engineArchive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $templateArchive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2-templates.tpz'
          $engineRoot = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          $templateRoot = Join-Path $env:APPDATA 'Godot/export_templates/4.7.2.stable'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/'
          Invoke-WebRequest ($base + 'Godot_v4.7.2-stable_win64.exe.zip') -OutFile $engineArchive
          if ((Get-FileHash -LiteralPath $engineArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') { throw 'Engine archive checksum mismatch' }
          Expand-Archive -LiteralPath $engineArchive -DestinationPath $engineRoot
          Invoke-WebRequest ($base + 'Godot_v4.7.2-stable_export_templates.tpz') -OutFile $templateArchive
          if ((Get-FileHash -LiteralPath $templateArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011') { throw 'Template archive checksum mismatch' }
          New-Item -ItemType Directory -Path $templateRoot -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($templateArchive)
          try {
            $entry = $archive.GetEntry('templates/web_nothreads_release.zip')
            if (-not $entry) { throw 'Missing single-threaded Web template' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $templateRoot 'web_nothreads_release.zip'), $false)
          } finally { $archive.Dispose() }
          $enginePath = Join-Path $engineRoot 'Godot_v4.7.2-stable_win64_console.exe'
          "GODOT_COMMAND=$enginePath" >> $env:GITHUB_ENV
      - name: Verify game and export browser build
        shell: pwsh
        run: |
          ./scripts/verify.ps1 -GodotCommand $env:GODOT_COMMAND
          ./scripts/build_web.ps1 -GodotCommand $env:GODOT_COMMAND -BuildName pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload exported game only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web-crossdevice/pages/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
