[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.md"
exclude_filter="tests/*"
export_path="../build/ThunderVector3D.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
texture_format/no_bptc_fallbacks=false
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/ui/player_ship.png"
application/console_wrapper_icon="res://assets/ui/player_ship.png"
application/file_version="1.1.0.0"
application/product_version="1.1.0.0"
application/company_name=""
application/product_name="Thunder Vector 3D"
application/file_description="Offline 3D vertical shooter"

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web_crossdevice"
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*,assets/generated/*PROVENANCE.md"
export_path="../build/web-crossdevice/site/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="../web/index.html"
html/head_include=""
html/canvas_resize_policy=0
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.025, 0.045, 0.08, 1)
